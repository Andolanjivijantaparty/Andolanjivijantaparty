<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .profile {
      text-align: center;
    }

    .dp {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

  <div class="profile">
    <img src="logo.png" alt="Profile Photo" class="dp">
  </div>

</body>
</html>
