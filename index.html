<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>अंधभक्त जनता पार्टी (AJP) | आधिकारिक वेबसाइट</title>
<meta name="description" content="अंधभक्त जनता पार्टी (AJP) की आधिकारिक वेबसाइट। पार्टी का परिचय, उद्देश्य, घोषणापत्र, समाचार और संपर्क जानकारी।">
<meta name="keywords" content="अंधभक्त जनता पार्टी, AJP, Andhbhakt Janta Party, AJP India">
<meta name="robots" content="index, follow">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:Arial,"Noto Sans Devanagari",sans-serif;
background:#f6f6f6;color:#171717;line-height:1.7
}
header{
position:sticky;top:0;z-index:1000;
background:#080808;color:white;
padding:10px 5%;
display:flex;align-items:center;justify-content:space-between;
box-shadow:0 3px 15px #0005
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:58px;height:58px;object-fit:contain;border-radius:50%}
.brand h2{font-size:20px;line-height:1.2}
.brand span{color:#ff7200}
.brand p{font-size:12px;color:#ccc}
nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
nav a{color:white;text-decoration:none;font-weight:bold;font-size:14px}
nav a:hover{color:#ff7200}
.join-btn{background:#ff7200;padding:9px 16px;border-radius:6px}

.hero{
min-height:620px;
display:flex;align-items:center;justify-content:center;
text-align:center;color:white;padding:50px 20px;
background:
linear-gradient(#000b,#000b),
linear-gradient(135deg,#200900,#ff7200)
}
.hero-content{max-width:950px}
.hero-logo{
width:200px;height:200px;object-fit:contain;
border-radius:50%;background:white;
border:5px solid #ff7200;margin-bottom:20px
}
.hero h1{font-size:55px;line-height:1.2;margin-bottom:10px}
.orange{color:#ff7200}
.hero h3{font-size:25px;margin-bottom:8px}
.hero p{font-size:19px;color:#eee}
.btn{
display:inline-block;margin-top:22px;padding:12px 27px;
background:#ff7200;color:white;text-decoration:none;
border-radius:6px;font-weight:bold
}

section{padding:70px 7%}
.title{text-align:center;margin-bottom:40px}
.title h2{
font-size:34px;display:inline-block;
border-bottom:4px solid #ff7200;padding-bottom:6px
}
.title p{color:#666;margin-top:8px}

.about{
max-width:1050px;margin:auto;
display:grid;grid-template-columns:1fr 1.4fr;
gap:50px;align-items:center
}
.about img{width:330px;max-width:100%;display:block;margin:auto}
.about h3{font-size:28px;color:#ff7200;margin-bottom:12px}
.about p{margin-bottom:12px}

.cards{
max-width:1200px;margin:auto;
display:grid;grid-template-columns:repeat(3,1fr);gap:22px
}
.card{
background:white;padding:28px 22px;text-align:center;
border-radius:10px;border:1px solid #eee;
box-shadow:0 5px 18px #00000010;
transition:.2s
}
.card:hover{transform:translateY(-4px);border-color:#ff7200}
.icon{font-size:40px;margin-bottom:8px}
.card h3{
